apiVersion: v1
kind: Pod
metadata:
  name: client-pod
  labels:
    component: web
spec:
  containers:
    - name: client
      image: srebreni3/multi-client
      ports: 
        - containerPort: 3000

# Kind represents the type of Kubernetes object that we want to make, in this case, a Pod.
# Objects serve different purposes - running a container (pod), monitoring a container, setting up networking (service), etc.
# Any time we want to create container, we need to create a Pod object.
# We can create one or multiple containers inside a Pod.